<title>귀야제 괴이 도감</title>

<style>
/* Layout: 폐교 복도에서 꺼내 보는 괴이 조사 기록. 목록(도감)과 개별 기록(QR 주소)이 한 파일 안에서 해시로 전환된다. */
:root {
  --bg: #0a0505;
  --surface: #140a0b;
  --surface-2: #1f0e10;
  --line: #3b1a1e;
  --fg: #f1e6e1;

  --kr: #e8d6b0;

  --f-brush: "East Sea Dokdo", "Yeon Sung", cursive;
  --f-body: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 55% at 50% 0%, var(--glow), transparent 70%), radial-gradient(90% 40% at 50% 100%, rgba(140, 15, 25, 0.18), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--tube); outline-offset: 3px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* 상단 바 */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 10px; color: var(--tube); font-size: 13px; letter-spacing: 0.08em; }
.mark svg { width: 26px; height: auto; flex: none; }
.back { font-size: 14px; color: var(--muted); padding: 6px 0; }
.back:hover { color: var(--tube); }

/* 도감 머리 */
.hero { padding-block: 36px 24px; }
.eyebrow { font-size: 13px; letter-spacing: 0.22em; color: var(--muted); margin: 0 0 10px; }
.title {
  font-family: var(--f-brush); font-weight: 400;
  font-size: clamp(3.8rem, 20vw, 6.8rem); line-height: 1; margin: 0;
  color: var(--tube);
  text-shadow: 0 0 22px rgba(255, 69, 69, 0.55), 0 3px 0 #5a0b10;

}
.title small { display: block; font-family: var(--f-jp); font-weight: 700; font-size: 0.34em; letter-spacing: 0.4em; color: var(--muted); text-shadow: none; margin-top: 10px; }
@keyframes tube {
  0%, 90%, 94%, 100% { opacity: 1; }
  91% { opacity: 0.55; }
  92% { opacity: 1; }
  93% { opacity: 0.7; }
}
.lede { max-width: 30em; color: var(--muted); margin: 18px 0 0; font-size: 15px; }

/* 조사 진행 */
.progress { display: flex; align-items: center; gap: 14px; margin: 8px 0 22px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.progress b { font-weight: 700; color: var(--tube); font-variant-numeric: tabular-nums; }
.progress .txt { font-size: 14px; flex: none; }
.slots { display: flex; gap: 5px; flex: 1; min-width: 0; }
.slots i { flex: 1; height: 6px; background: var(--surface-2); border-radius: 1px; }
.slots i.on { background: var(--tube); box-shadow: 0 0 8px rgba(255, 69, 69, 0.5); }

/* 필터 */
.chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.chip:hover { border-color: var(--muted); color: var(--fg); }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--tube); border-color: var(--tube); font-weight: 500; }

/* 카드 목록 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; height: 100%; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid #8e1b22; border-radius: 4px; transition: border-color 0.2s, background 0.2s; }
.card:hover { border-color: var(--tube); background: var(--surface-2); }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.55rem; line-height: 1.25; margin: 0; }
.card .alt { font-family: var(--f-jp); font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 700; }
.card p { grid-column: 1 / -1; margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.card .kind { grid-column: 1 / -1; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }

/* 국가 도장, 조사 도장 */
.stamp { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; padding: 1px 8px; border: 1.5px solid currentColor; border-radius: 2px; transform: rotate(-3deg); white-space: nowrap; }
.stamp.kr { color: var(--kr); }
.stamp.jp { color: var(--jp); }
.seal { font-size: 12px; letter-spacing: 0.1em; white-space: nowrap; }
.seal.done { color: var(--tube); }
.seal.todo { color: var(--muted); opacity: 0.8; }

/* 개별 기록 */
.record { padding-top: 32px; }
.record .stamp { font-size: 13px; padding: 2px 10px; }
.record h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 13vw, 4rem); line-height: 1.1; margin: 14px 0 0; color: var(--tube); text-shadow: 0 0 16px rgba(255, 69, 69, 0.3); }
.record .alt { font-family: var(--f-jp); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.3em; color: var(--muted); margin: 6px 0 0; }
.record .tagline { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.55; margin: 18px 0 0; max-width: 24em; text-wrap: balance; }
.facts { margin: 28px 0 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.facts dt { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; padding-top: 2px; }
.facts dd { margin: 0; }
.sec { margin-top: 36px; max-width: 36em; }
.sec h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: var(--tube); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
.sec h2::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.sec p { margin: 0 0 1em; line-height: 1.9; }
.sec.fun { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.sec.fun p:last-child { margin-bottom: 0; }
.source { margin-top: 14px; font-size: 13px; color: var(--muted); }
.more { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
.more h2 { font-size: 13px; letter-spacing: 0.2em; color: var(--muted); font-weight: 700; margin: 0 0 12px; }
.more .row { display: flex; flex-wrap: wrap; gap: 8px; }
.more a { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
.more a:hover { border-color: var(--tube); color: var(--tube); }
.more a.all { background: var(--tube); color: var(--bg); border-color: var(--tube); font-weight: 500; }
.foot { margin-top: 40px; font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-align: center; }

/* 방탈출 */
.escape-link { display: flex; align-items: center; gap: 12px; margin-top: 28px; padding: 14px 16px; border: 1px solid var(--tube); border-radius: 4px; background: var(--surface); }
.escape-link span { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
.escape-link b { display: block; font-family: var(--f-display); font-size: 1.25rem; color: var(--tube); }
.escape-link i { margin-left: auto; font-style: normal; color: var(--tube); font-size: 1.3rem; }
.escape-link:hover { background: var(--surface-2); }
.plan { margin-top: 14px; }
.plan svg, .cardimg svg { width: 100%; height: auto; display: block; }
.fl-room { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
.fl-furn { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
.fl-txt { fill: var(--muted); font-size: 10px; font-family: var(--f-body); text-anchor: middle; }
.fl-clue { fill: var(--tube); }
.fl-num { fill: var(--bg); font-size: 12px; font-weight: 700; text-anchor: middle; font-family: var(--f-body); }
.fl-hi { stroke: var(--tube); stroke-width: 2.5; }
.fl-door { stroke: var(--bg); stroke-width: 5; }
.cluelist { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 14px; }
.cluelist li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
.cluelist .n, .flow .n { width: 28px; height: 28px; border-radius: 50%; background: var(--tube); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.cluelist h3 { margin: 0; font-size: 16px; font-weight: 700; }
.cluelist p { margin: 2px 0 0; font-size: 14px; color: var(--muted); line-height: 1.65; }
.note { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.flow { list-style: none; margin: 18px 0 0; padding: 0; }
.flow li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 24px; }
.flow li::before { content: ""; position: absolute; left: 16.5px; top: 36px; bottom: 2px; width: 1px; background: var(--line); }
.flow li:last-child { padding-bottom: 0; }
.flow li:last-child::before { display: none; }
.flow .n { width: 34px; height: 34px; background: var(--bg); border: 1.5px solid var(--tube); color: var(--tube); position: relative; z-index: 1; }
.flow h3 { margin: 4px 0 0; font-size: 16px; font-weight: 700; }
.flow p { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.7; }
.combine { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.combine .box { flex: 1 1 120px; min-width: 0; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 4px; font-size: 13px; line-height: 1.5; }
.combine .box small { display: block; color: var(--muted); font-size: 12px; }
.combine .op { color: var(--tube); font-weight: 700; }
.pw { display: flex; gap: 6px; }
.pw i { width: 28px; height: 34px; border: 1.5px solid var(--tube); border-radius: 3px; display: grid; place-items: center; font-style: normal; color: var(--tube); }
.cardimg { max-width: 300px; margin: 16px auto 0; }
.cd-frame { fill: var(--surface); stroke: var(--tube); stroke-width: 2; }
.cd-inner { fill: none; stroke: var(--line); stroke-width: 1; }
.cd-hill { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
.cd-wave { fill: none; stroke: var(--tube); stroke-width: 2; stroke-linecap: round; }
.cd-small { fill: var(--muted); font-size: 11px; letter-spacing: 0.2em; text-anchor: middle; font-family: var(--f-body); }
.cd-name { fill: var(--tube); font-family: var(--f-display); font-weight: 400; font-size: 42px; text-anchor: middle; }
.cd-sub { fill: var(--fg); font-size: 13px; text-anchor: middle; font-family: var(--f-body); }
.cd-stamp-box { fill: rgba(10, 5, 5, 0.78); stroke: var(--jp); stroke-width: 2; }
.cd-stamp { fill: var(--jp); font-size: 16px; font-weight: 700; letter-spacing: 0.15em; text-anchor: middle; font-family: var(--f-body); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.pager a { padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; }
.pager a.next { background: var(--tube); color: var(--bg); border-color: var(--tube); font-weight: 500; }
.pager a:hover { border-color: var(--tube); }


/* 전승 기록 */
.sec.lore h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; color: var(--fg); margin: 24px 0 6px; line-height: 1.4; }
.sec.lore h3::before { content: "◆ "; color: var(--tube); font-size: 0.75em; }
.sec.lore h3:first-of-type { margin-top: 4px; }
.tl { list-style: none; margin: 8px 0 0; padding: 0 0 0 16px; border-left: 1px solid #6e1a20; }
.tl li { position: relative; padding: 0 0 14px 14px; display: grid; gap: 2px; }
.tl li::before { content: ""; position: absolute; left: -21px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--tube); box-shadow: 0 0 8px rgba(255, 69, 69, 0.6); }
.tl b { color: var(--tube); font-size: 15px; font-weight: 700; }
.tl span { color: var(--muted); font-size: 14px; line-height: 1.65; }
.caveat { margin: 20px 0 0 !important; padding: 10px 14px; border-left: 3px solid #8e1b22; background: var(--surface); color: var(--muted); font-size: 14px; line-height: 1.7 !important; }
.reflist { margin: 0; padding-left: 1.2em; font-size: 14px; color: var(--muted); line-height: 1.7; }
.reflist li { margin-bottom: 6px; }
.reflist a { color: var(--fg); border-bottom: 1px solid #8e1b22; }
.reflist a:hover { color: var(--tube); }

@media (max-width: 420px) {
  .facts div { grid-template-columns: 4.6em minmax(0, 1fr); gap: 10px; }
  .progress { flex-wrap: wrap; }
  .slots { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .title { animation: none; }
  .card { transition: none; }
}
</style>

function loreHtml(g) {

  var tl = L.tl ? '<h3>' + L.tlTitle + '</h3><ol class="tl">' + L.tl.map(function (t) { return '<li><b>' + t[0] + '</b><span>' + t[1] + '</span></li>'; }).join('') + '</ol>' : '';
  var refs = L.refs.map(function (r) { return '<li>' + (r[1] ? '<a href="' + r[1] + '" target="_blank" rel="noopener">' + r[0] + '</a>' : r[0]) + '</li>'; }).join('');
  return '<section class="sec lore"><h2>전승 기록</h2>' + blocks + tl + (L.caveat ? '<p class="caveat">' + L.caveat + '</p>' : '') + '</section>' +

}

var KEY = 'gwiyaje-seen';
var memSeen = [];
var filter = 'all';

function getSeen() {
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || '[]');
    return Array.isArray(s) ? s : memSeen;
  } catch (e) { return memSeen; }
}
function markSeen(id) {
  var s = getSeen().slice();
  if (s.indexOf(id) === -1) s.push(id);
  memSeen = s;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
}

function cardPhoto(id) {
  var src = CARDIMG[id];
  if (!src) return motif(id);
  return '<defs><clipPath id="cardclip"><rect x="30" y="54" width="240" height="238" rx="2"/></clipPath></defs>' +
    '<image href="' + src + '" x="30" y="54" width="240" height="238" preserveAspectRatio="xMidYMin slice" clip-path="url(#cardclip)"/>' +
    '<rect x="30" y="54" width="240" height="238" rx="2" fill="none" style="stroke:var(--tube);stroke-width:1.5"/>';
}

function recordCard(g, e) {
  var big = g.name.length > 4 ? ' style="font-size:32px"' : '';
  return '<svg viewBox="0 0 300 420" role="img" aria-label="' + g.name + ' 기록 카드. 탈출 성공 도장">' +
    '<rect class="cd-frame" x="4" y="4" width="292" height="412" rx="4"/><rect class="cd-inner" x="14" y="14" width="272" height="392"/>' +
    '<text class="cd-small" x="150" y="44">' + g.name + ' 기록 카드</text>' +
    cardPhoto(g.id) +
    '<text class="cd-name" x="150" y="318"' + big + '>' + g.name + '</text>' +
    '<text class="cd-sub" x="150" y="344">' + e.cardSub + '</text>' +
    '<text class="cd-small" x="150" y="372" style="letter-spacing:0.08em">' + g.facts[0][1] + '</text>' +
    '<text class="cd-small" x="150" y="394">귀야제 鬼夜祭</text>' +
    '<g transform="rotate(-8 214 250)"><rect class="cd-stamp-box" x="166" y="232" width="96" height="36" rx="2"/><text class="cd-stamp" x="214" y="257">탈출 성공</text></g>' +
    '</svg>';
}

function escapeLink(g) {
  var e = ESCAPES[g.id];
  return '<a class="escape-link" href="#' + g.id + '-escape"><div><span>체험 안내</span><b>' + g.name + ' 방탈출 · ' + e.short + '</b></div><i>→</i></a>';
}

function renderEscape(g, page) {
  var e = ESCAPES[g.id];
  var top = '<div class="topbar"><div class="mark">' + TORII + '<span>鬼夜祭</span></div><a class="back" href="#' + g.id + '">← ' + g.name + '</a></div>';
  var foot = '<p class="foot">귀야제 鬼夜祭 · 경계가 열리는 밤</p>';
  if (page === 1) {
    var facts = e.facts.map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; }).join('');
    var story = e.story.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    var clues = e.clues.map(function (c, i) { return '<li><span class="n">' + (i + 1) + '</span><div><h3>' + c[0] + '</h3><p>' + c[1] + '</p></div></li>'; }).join('');
    app().innerHTML = top +
      '<article class="record">' +
      '<span class="stamp ' + g.origin + '">방탈출 · 1 / 2</span>' +
      '<h1>' + g.name + ' 방탈출</h1>' +
      '<p class="tagline">' + e.tagline + '</p>' +
      '<dl class="facts">' + facts + '</dl>' +
      '<section class="sec"><h2>체험 스토리</h2>' + story + '</section>' +
      '<section class="sec"><h2>' + e.planTitle + '</h2>' +
      '<div class="plan">' + planSvg(g.name, e.plan) + '</div>' +
      '<ol class="cluelist">' + clues + '</ol>' +
      '<p class="note">※ 단서의 위치는 배치 예시입니다. 실제 공간에 맞춰 달라질 수 있습니다.</p></section>' +
      '<section class="sec"><h2>전승과 창작</h2><p>' + e.note + '</p></section>' +
      '<div class="pager"><a href="#' + g.id + '">' + g.name + ' 기록</a><a class="next" href="#' + g.id + '-escape-2">탈출 과정 보기 →</a></div>' +
      '</article>' + foot;
  } else {
    var steps = e.steps.map(function (st, i) {
      var extra = '';
      if (st.pw) {
        var parts = e.combine.map(function (c) { return '<div class="box">' + c[0] + (c[1] ? '<small>' + c[1] + '</small>' : '') + '</div>'; }).join('<span class="op">+</span>');
        extra = '<div class="combine">' + parts + '<span class="op">=</span><div class="pw" aria-label="비밀번호 칸"><i>?</i><i>?</i><i>?</i><i>?</i></div></div>' +
          '<p class="note">※ 비밀번호의 단어와 숫자는 미션이 정해지면 채워집니다. 칸 수는 예시입니다.</p>';
      }
      return '<li><span class="n">' + (i + 1) + '</span><div><h3>' + st.t + '</h3><p>' + st.d + '</p>' + extra + '</div></li>';
    }).join('');
    app().innerHTML = top +
      '<article class="record">' +
      '<span class="stamp ' + g.origin + '">방탈출 · 2 / 2</span>' +
      '<h1>탈출 과정</h1>' +
      '<p class="tagline">' + e.short + '에서 단서를 모으고, 맞추고, 빠져나갑니다.</p>' +
      '<section class="sec"><h2>진행 순서</h2><ol class="flow">' + steps + '</ol></section>' +
      '<section class="sec"><h2>탈출 성공 보상</h2>' +
      '<p>탈출에 성공한 관람객에게는 ' + g.name + ' 기록 카드를 드립니다.</p>' +
      '<div class="cardimg">' + recordCard(g, e) + '</div></section>' +
      '<div class="pager"><a href="#' + g.id + '-escape">← 체험 공간 소개</a><a class="next" href="#list">괴이 도감으로</a></div>' +
      '</article>' + foot;
  }
}

function route() {
  var h = location.hash.slice(1);
  var g = null;
  for (var i = 0; i < GHOSTS.length; i++) { if (GHOSTS[i].id === h) g = GHOSTS[i]; }
  var m = /^([a-z]+)-escape(-2)?$/.exec(h);
  var eg = null;
  if (m) { for (var j = 0; j < GHOSTS.length; j++) { if (GHOSTS[j].id === m[1] && ESCAPES[m[1]]) eg = GHOSTS[j]; } }
  if (eg) renderEscape(eg, m[2] ? 2 : 1);
  else if (g) renderDetail(g); else renderList();
  window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.chip') : null;
  if (!b) return;
  filter = b.getAttribute('data-f');
  renderList();
});
window.addEventListener('hashchange', route);
route();
</script>

</body></html>
